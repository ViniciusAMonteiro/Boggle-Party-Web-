<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="titulo descricao"><title id="titulo">Do projeto ao celular em seis etapas</title><desc id="descricao">Guia esquemático, não captura do Console. Crie projeto Spark, registre aplicativo, habilite login anônimo, configure Realtime Database, publique no GitHub Pages e convide amigos.</desc><rect width="960" height="560" rx="24" fill="#101326"/><g font-family="Arial,sans-serif"><text x="40" y="57" fill="#baff70" font-size="28" font-weight="bold">BOGGLE PARTY WEB</text><text x="40" y="87" fill="#adb5d1" font-size="16">Seu caminho do Firebase à primeira partida · guia esquemático</text></g><g font-family="Arial,sans-serif"><g transform="translate(40 120)"><rect width="275" height="170" rx="17" fill="#1c2038" stroke="#404563"/><text x="20" y="35" fill="#baff70" font-size="18">① PROJETO SPARK</text><text x="20" y="72" fill="white" font-size="16">Firebase Console</text><text x="20" y="102" fill="#adb5d1" font-size="14">Criar projeto → plano gratuito</text><text x="20" y="133" fill="#adb5d1" font-size="14">Analytics opcional</text></g><g transform="translate(342 120)"><rect width="275" height="170" rx="17" fill="#1c2038" stroke="#404563"/><text x="20" y="35" fill="#baff70" font-size="18">② APLICATIVO WEB</text><text x="20" y="72" fill="white" font-size="16">Visão geral → ícone &lt;/&gt;</text><text x="20" y="102" fill="#adb5d1" font-size="14">Copiar objeto de configuração</text><text x="20" y="133" fill="#adb5d1" font-size="14">Colar em firebase-config.js</text></g><g transform="translate(644 120)"><rect width="275" height="170" rx="17" fill="#1c2038" stroke="#404563"/><text x="20" y="35" fill="#baff70" font-size="18">③ LOGIN ANÔNIMO</text><text x="20" y="72" fill="white" font-size="16">Build → Authentication</text><text x="20" y="102" fill="#adb5d1" font-size="14">Método de login → Anônimo</text><text x="20" y="133" fill="#adb5d1" font-size="14">Ativar e salvar</text></g><g transform="translate(40 315)"><rect width="275" height="170" rx="17" fill="#1c2038" stroke="#404563"/><text x="20" y="35" fill="#a79bff" font-size="18">④ REALTIME DATABASE</text><text x="20" y="72" fill="white" font-size="16">Build → Realtime Database</text><text x="20" y="102" fill="#adb5d1" font-size="14">Criar banco → copiar URL</text><text x="20" y="133" fill="#adb5d1" font-size="14">Regras → colar JSON → Publicar</text></g><g transform="translate(342 315)"><rect width="275" height="170" rx="17" fill="#1c2038" stroke="#404563"/><text x="20" y="35" fill="#a79bff" font-size="18">⑤ GITHUB PAGES</text><text x="20" y="72" fill="white" font-size="16">Repositório público → arquivos</text><text x="20" y="102" fill="#adb5d1" font-size="14">Settings → Pages → branch</text><text x="20" y="133" fill="#adb5d1" font-size="14">main / (root) → Save</text></g><g transform="translate(644 315)"><rect width="275" height="170" rx="17" fill="#1c2038" stroke="#404563"/><text x="20" y="35" fill="#a79bff" font-size="18">⑥ HORA DE JOGAR</text><text x="20" y="72" fill="white" font-size="16">Abra o link no celular</text><text x="20" y="102" fill="#adb5d1" font-size="14">Criar sala → compartilhar link</text><text x="20" y="133" fill="#adb5d1" font-size="14">Adicione à tela inicial</text></g><text x="40" y="530" fill="#adb5d1" font-size="14">Solo funciona sem Firebase. Para multiplayer, configure autenticação + banco + credenciais.</text></g></svg>
